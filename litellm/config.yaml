# LiteLLM proxy configuration for multiple OpenRouter accounts.
# Named models and endpoint weights are canonical in PostgreSQL and managed via UI.
# Keep credentials in litellm/.env (never commit that file).

model_list:
  # Config-only wildcard deployments preserve arbitrary OpenRouter model IDs.
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_1
      api_base: https://openrouter.ai/api/v1

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_2
      api_base: https://openrouter.ai/api/v1

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_3
      api_base: https://openrouter.ai/api/v1

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_4
      api_base: https://openrouter.ai/api/v1

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_5
      api_base: https://openrouter.ai/api/v1

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_6
      api_base: https://openrouter.ai/api/v1

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_7
      api_base: https://openrouter.ai/api/v1

  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_8
      api_base: https://openrouter.ai/api/v1

general_settings:
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: true

router_settings:
  # Cool down a deployment after its first upstream rate-limit response.
  allowed_fails: 1
  cooldown_time: 600  # 10 minutes, in seconds
