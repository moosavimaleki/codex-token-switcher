# LiteLLM proxy configuration for multiple OpenRouter accounts.
# Keep credentials in litellm/.env (never commit that file).

model_list:
  # Primary OpenAI-compatible local-infra endpoint.
  - model_name: "et-coder"
    litellm_params:
      model: "openai/et-coder"
      api_base: https://dai.eitaa.ir/et-coder/v1
      api_key: EMPTY
      weight: 10

  # Weighted agent endpoint. Call model="agent" to prefer et-coder while
  # retaining strong OpenRouter models as alternatives.
  - model_name: "agent"
    litellm_params:
      model: "openai/et-coder"
      api_base: https://dai.eitaa.ir/et-coder/v1
      api_key: EMPTY
      weight: 10

  - model_name: "agent"
    litellm_params:
      model: "openrouter/z-ai/glm-5.2:free"
      api_key: os.environ/OPENROUTER_API_KEY_1
      api_base: https://openrouter.ai/api/v1
      weight: 1

  - model_name: "agent"
    litellm_params:
      model: "openrouter/thinkingmachines/inkling:free"
      api_key: os.environ/OPENROUTER_API_KEY_2
      api_base: https://openrouter.ai/api/v1
      weight: 1

  - model_name: "agent"
    litellm_params:
      model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
      api_key: os.environ/OPENROUTER_API_KEY_3
      api_base: https://openrouter.ai/api/v1
      weight: 1

  - model_name: "agent"
    litellm_params:
      model: "openrouter/poolside/laguna-s-2.1:free"
      api_key: os.environ/OPENROUTER_API_KEY_4
      api_base: https://openrouter.ai/api/v1
      weight: 1

  - model_name: "agent"
    litellm_params:
      model: "openrouter/nvidia/nemotron-3-super-120b-a12b:free"
      api_key: os.environ/OPENROUTER_API_KEY_5
      api_base: https://openrouter.ai/api/v1
      weight: 1

  - model_name: "agent"
    litellm_params:
      model: "openrouter/google/gemma-4-31b-it:free"
      api_key: os.environ/OPENROUTER_API_KEY_6
      api_base: https://openrouter.ai/api/v1
      weight: 1

  # Each deployment is one OpenRouter account. The wildcard preserves model IDs.
  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_1
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_2
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_3
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_4
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_5
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_6
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_7
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_8
      api_base: https://openrouter.ai/api/v1

general_settings:
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  # Cool down a deployment after its first upstream rate-limit response.
  allowed_fails: 1
  cooldown_time: 600  # 10 minutes, in seconds
