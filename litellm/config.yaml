# LiteLLM proxy configuration for multiple OpenRouter accounts.
# Keep credentials in litellm/.env (never commit that file).

model_list:
  # Each deployment is one OpenRouter account. The wildcard preserves model IDs.
  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_1
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_2
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_3
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_4
      api_base: https://openrouter.ai/api/v1

  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY_5
      api_base: https://openrouter.ai/api/v1

general_settings:
  database_url: os.environ/DATABASE_URL
  master_key: os.environ/LITELLM_MASTER_KEY
